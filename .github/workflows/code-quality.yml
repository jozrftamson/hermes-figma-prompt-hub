name: Code Quality Review

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python linters
        run: |
          python -m pip install --upgrade pip
          pip install pylint black flake8 isort

      - name: Lint Python files
        id: python_lint
        continue-on-error: true
        run: |
          echo "🔍 Running Python linters..."
          
          # Check Python files
          python_files=$(find scripts mcp -name "*.py" -type f 2>/dev/null || echo "")
          
          if [ -n "$python_files" ]; then
            echo "Files to lint: $python_files"
            
            # Flake8
            echo "Running flake8..."
            flake8 $python_files --count --statistics --max-line-length=120 || true
            
            # Check for missing docstrings (pylint)
            echo "Running pylint..."
            pylint $python_files --disable=all --enable=missing-docstring --exit-zero || true
            
            # Check formatting (black)
            echo "Checking formatting with black..."
            black --check --diff $python_files || true
          else
            echo "⚠️  No Python files found to lint"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Check Node dependencies
        id: npm_check
        continue-on-error: true
        run: |
          echo "🔍 Checking npm dependencies..."
          npm ci --prefer-offline
          
          # Run npm audit
          npm audit --audit-level=moderate || echo "⚠️  Some packages have security issues"

  validate-prompts:
    name: Validate Prompts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Validate all prompts
        id: validate
        continue-on-error: true
        run: |
          echo "🔍 Validating prompt files..."
          
          if [ -d "prompts" ]; then
            python3 scripts/validate_all.py prompts/
          else
            echo "⚠️  No prompts directory found"
          fi

      - name: Check schema
        id: schema_check
        continue-on-error: true
        run: |
          echo "🔍 Checking schema..."
          
          if [ -d "prompts" ] && [ -f "scripts/schema_validator.py" ]; then
            for file in prompts/**/*.json; do
              if [ -f "$file" ]; then
                echo "Schema check: $file"
                python3 scripts/schema_validator.py "$file" || true
              fi
            done
          fi

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install markdown-lint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        id: markdown_lint
        continue-on-error: true
        run: |
          echo "🔍 Linting Markdown files..."
          
          md_files=$(find . -name "*.md" -type f \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            || echo "")
          
          if [ -n "$md_files" ]; then
            markdownlint $md_files || true
          else
            echo "No markdown files found"
          fi

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          config_data: |
            rules:
              line-length:
                max: 120
              indentation:
                spaces: 2
              comments:
                min-spaces-from-content: 1

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Check for secrets
        id: secrets_check
        continue-on-error: true
        run: |
          echo "🔍 Checking for exposed secrets..."
          
          # Look for common secret patterns in code
          if grep -r "FIGMA_TOKEN\|API_KEY\|SECRET_KEY" . \
            --include="*.js" --include="*.ts" --include="*.vue" \
            --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null; then
            echo "⚠️  Potential hardcoded secrets found in code"
          else
            echo "✅ No obvious hardcoded secrets in code"
          fi

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        id: npm_install
        continue-on-error: true
        run: |
          echo "📦 Installing dependencies..."
          npm ci --prefer-offline --no-audit

      - name: Build check
        id: build
        continue-on-error: true
        if: steps.npm_install.outcome == 'success'
        run: |
          echo "🔨 Building project..."
          npm run build 2>&1 || echo "⚠️  Build failed or not configured"

      - name: TypeScript check
        id: typescript
        continue-on-error: true
        if: hashFiles('tsconfig.json') != ''
        run: |
          echo "🔍 Checking TypeScript..."
          npx tsc --noEmit || true

  test-check:
    name: Test Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        continue-on-error: true
        run: npm ci --prefer-offline --no-audit

      - name: Run tests
        id: test
        continue-on-error: true
        run: |
          echo "🧪 Running tests..."
          if npm run test 2>&1; then
            echo "✅ Tests passed"
          else
            echo "⚠️  Tests not available or failed"
          fi

  code-quality-summary:
    name: Code Quality Summary
    needs: [lint-and-format, validate-prompts, markdown-lint, yaml-lint, security-check, build-check, test-check]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Determine job outcomes
        id: outcomes
        run: |
          echo "lint_format=${{ needs.lint-and-format.result }}" >> $GITHUB_OUTPUT
          echo "validate=${{ needs.validate-prompts.result }}" >> $GITHUB_OUTPUT
          echo "markdown=${{ needs.markdown-lint.result }}" >> $GITHUB_OUTPUT
          echo "yaml=${{ needs.yaml-lint.result }}" >> $GITHUB_OUTPUT
          echo "security=${{ needs.security-check.result }}" >> $GITHUB_OUTPUT
          echo "build=${{ needs.build-check.result }}" >> $GITHUB_OUTPUT
          echo "test=${{ needs.test-check.result }}" >> $GITHUB_OUTPUT

      - name: Check workflow status
        run: |
          echo "## 📊 Code Quality Report"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| Lint & Format | ${{ steps.outcomes.outputs.lint_format }} |"
          echo "| Prompt Validation | ${{ steps.outcomes.outputs.validate }} |"
          echo "| Markdown Lint | ${{ steps.outcomes.outputs.markdown }} |"
          echo "| YAML Lint | ${{ steps.outcomes.outputs.yaml }} |"
          echo "| Security | ${{ steps.outcomes.outputs.security }} |"
          echo "| Build | ${{ steps.outcomes.outputs.build }} |"
          echo "| Tests | ${{ steps.outcomes.outputs.test }} |"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const checks = {
              'Lint & Format': '${{ steps.outcomes.outputs.lint_format }}',
              'Prompt Validation': '${{ steps.outcomes.outputs.validate }}',
              'Markdown Lint': '${{ steps.outcomes.outputs.markdown }}',
              'YAML Lint': '${{ steps.outcomes.outputs.yaml }}',
              'Security': '${{ steps.outcomes.outputs.security }}',
              'Build': '${{ steps.outcomes.outputs.build }}',
              'Tests': '${{ steps.outcomes.outputs.test }}'
            };

            const statusEmoji = (result) => {
              if (result === 'success') return '✅';
              if (result === 'failure') return '❌';
              if (result === 'skipped') return '⏭️';
              return '⚠️';
            };

            let body = '## 🔍 Code Quality Review\n\n';
            body += '| Check | Status |\n';
            body += '|-------|--------|\n';
            for (const [check, result] of Object.entries(checks)) {
              body += `| ${check} | ${statusEmoji(result)} ${result} |\n`;
            }
            body += '\n*Generated by Code Quality Review workflow*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
