name: Sync Prompts from Figma

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  sync-figma:
    name: Sync from Figma
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Check credentials
        id: check_creds
        run: |
          if [ -z "${{ secrets.FIGMA_API_TOKEN }}" ] || [ -z "${{ secrets.FIGMA_FILE_ID }}" ]; then
            echo "❌ Figma credentials not configured"
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Figma credentials found"
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Python dependencies
        if: steps.check_creds.outputs.configured == 'true'
        id: install_deps
        continue-on-error: true
        run: |
          echo "📦 Installing dependencies..."
          pip install requests --quiet
          if [ $? -eq 0 ]; then
            echo "Dependencies installed"
          else
            echo "Failed to install dependencies"
            exit 1
          fi

      - name: Import from Figma
        if: steps.check_creds.outputs.configured == 'true' && steps.install_deps.outcome == 'success'
        id: import
        continue-on-error: true
        env:
          FIGMA_API_TOKEN: ${{ secrets.FIGMA_API_TOKEN }}
          FIGMA_FILE_ID: ${{ secrets.FIGMA_FILE_ID }}
        run: |
          echo "🔄 Importing prompts from Figma..."
          
          # Create prompts directory if it doesn't exist
          mkdir -p prompts/raw
          
          # Run importer
          if python3 scripts/figma_importer.py "$FIGMA_API_TOKEN" "$FIGMA_FILE_ID" ./prompts/raw 2>&1; then
            echo "✅ Import successful"
            echo "import_status=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Import failed or no changes"
            echo "import_status=failed" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Validate imported prompts
        id: validate
        continue-on-error: true
        run: |
          echo "🔍 Validating prompts..."
          
          if [ ! -d "prompts/raw" ]; then
            echo "No prompts directory"
            exit 0
          fi
          
          error_count=0
          
          for file in prompts/raw/*.json; do
            if [ -f "$file" ]; then
              if ! python3 scripts/validate_prompt.py "$file" >/dev/null 2>&1; then
                ((error_count++))
                echo "⚠️  Validation failed: $file"
              fi
            fi
          done
          
          if [ $error_count -gt 0 ]; then
            echo "⚠️  $error_count prompts failed validation (continuing)"
          else
            echo "✅ All prompts valid"
          fi

      - name: Check for changes
        id: changes
        run: |
          echo "🔍 Checking for changes..."
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            # Show what changed
            echo "Changed files:"
            git status --short
          fi

      - name: Commit changes
        if: steps.changes.outputs.has_changes == 'true'
        id: commit
        continue-on-error: true
        run: |
          echo "📝 Committing changes..."
          
          git config --local user.email "figma-bot@github.local"
          git config --local user.name "Figma Sync Bot"
          
          # Stage changes
          git add prompts/ data/ || true
          
          # Create meaningful commit message
          SYNC_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')
          PROMPT_COUNT=$(find prompts/raw -name "*.json" -type f | wc -l)
          
          git commit -m "🔄 chore(figma): Sync prompts from Figma

Updated: $SYNC_TIME
Prompts: $PROMPT_COUNT

This commit was automatically generated by the Figma Sync workflow."
          
          if [ $? -eq 0 ]; then
            echo "✅ Changes committed"
            echo "commit_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Commit failed"
            echo "commit_status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: steps.commit.outputs.commit_status == 'success'
        id: push
        continue-on-error: true
        run: |
          echo "📤 Pushing changes..."
          
          git push origin main
          
          if [ $? -eq 0 ]; then
            echo "✅ Push successful"
            echo "push_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Push failed"
            echo "push_status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Create sync report
        if: always()
        run: |
          echo "## 📊 Figma Sync Report"
          echo ""
          echo "**Status:** ${{ job.status }}"
          echo "**Time:** $(date -u +'%Y-%m-%d %H:%M UTC')"
          echo ""
          echo "### Details"
          echo "- Credentials: ${{ steps.check_creds.outputs.configured }}"
          echo "- Import: ${{ steps.import.outcome }}"
          echo "- Validation: ${{ steps.validate.outcome }}"
          echo "- Changes: ${{ steps.changes.outputs.has_changes }}"
          echo "- Commit: ${{ steps.commit.outcome }}"
          echo "- Push: ${{ steps.push.outcome }}"

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Figma Sync Failed',
              body: `## Figma Sync Workflow Failed

The scheduled Figma sync workflow encountered an error.

### Workflow Run
[View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

### Details
- **Event:** Scheduled sync
- **Time:** ${new Date().toISOString()}
- **Status:** FAILED

Please check the workflow logs for details and fix any issues.`,
              labels: ['automation-failure']
            });
